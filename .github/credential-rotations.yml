# Credential Rotation Configuration
#
# The credential-rotation-reminder workflow checks this file daily and sends
# notifications (GitHub issue, Jira ticket, email) when a credential is within
# its remind_days_before window.
#
# After rotating a credential:
#   1. Update the 'expires' date below to the new expiration
#   2. Commit and push the change
#   3. Close the corresponding GitHub issue and Jira ticket
#
# Required fields per credential: name, description, expires, rotation_steps
# Optional fields (with defaults):
#   remind_days_before: 15        — days before expiry to start reminding
#   jira_priority: Highest        — Jira ticket priority
#   notes: (none)                 — additional context shown in notifications

email_to: tools@valideval.com
email_from: tools@valideval.com
jira_project: VEP

credentials:
  - name: CLAUDE_CODE_OAUTH_TOKEN
    description: Claude Code CI/CD token for @claude on PRs across the Valid-Eval org
    expires: "2027-01-29"
    remind_days_before: 15
    jira_priority: Highest
    rotation_steps: |-
      1. Run `claude setup-token` in a terminal (NOT inside Claude Code)
      2. Update at https://github.com/organizations/Valid-Eval/settings/secrets/actions
         - Find CLAUDE_CODE_OAUTH_TOKEN, click Update, paste new value
         - Verify repo visibility includes all repos that need it (currently ve-app, ve-zarf)
      3. Verify: trigger `@claude ping` on any open PR
    notes: |-
      - `claude setup-token` produces a long-lived CI/CD token
      - Do NOT use the session token from ~/.claude/.credentials.json (expires in hours)
      - Referenced as secrets.CLAUDE_CODE_OAUTH_TOKEN in workflows — no workflow changes needed on rotation

  - name: JIRA_API_TOKEN
    description: Atlassian API token for Jira REST API basic auth
    expires: "2027-01-19"
    remind_days_before: 15
    jira_priority: Highest
    rotation_steps: |-
      1. Go to https://id.atlassian.com/manage-profile/security/api-tokens
      2. Create a new API token (label it clearly, e.g. "ve-tools CI/CD Jan 2028")
      3. Update at https://github.com/organizations/Valid-Eval/settings/secrets/actions
         - Find JIRA_API_TOKEN, click Update, paste new value
      4. Test: manually trigger a workflow that uses the Jira API, or trigger this
         workflow via workflow_dispatch to verify the new token works
    notes: |-
      - Used with JIRA_USER_EMAIL for basic auth (email:token)
      - The email secret does not need rotation — only the token
      - If this token is already expired, the Jira notification step for OTHER
        credentials will also fail — rotate this one first

  - name: RAILS_SECRET_KEY_BASE
    description: Rails secret_key_base for ve-app backend (signs session cookies + HS256 JWTs) — unique per environment (staging + prod), stored in AWS Secrets Manager, ESO-synced into the cluster
    expires: "2027-08-05"
    remind_days_before: 15
    jira_priority: Highest
    rotation_steps: |-
      1. Generate a fresh 128-char hex value PER ENVIRONMENT (staging and prod must
         differ): `openssl rand -hex 64`
      2. Update the AWS Secrets Manager secret `<app-ns>/secret-key-base` in each
         account (staging: il2 staging acct; prod: il2 prod acct) with the new value
         (key: SECRET_KEY_BASE). Exact secret names per INF-137 / ve-iac PR #215 ESO setup.
      3. Wait for / force the ESO ExternalSecret sync, then restart the Rails
         deployments: `kubectl get deployment -n valid-eval -o name | grep backend |
         xargs kubectl -n valid-eval rollout restart`
         (do NOT use `-l app=ValidEval` — that label is chart-wide and would also
         restart non-Rails components)
      4. Verify per env: `kubectl exec` a backend pod →
         `bin/rails runner 'puts Rails.application.secret_key_base[0,6]'` matches the
         Secrets Manager value prefix, and interactive login works.
      5. NOTE: rotation invalidates ALL active sessions and outstanding JWTs — schedule
         in a maintenance window / off-hours and give users notice.
    notes: |-
      - Origin: Dark Wolf July 2026 pen test §4.2 (F-PT-2), Jira VEP-1977 (app fix) +
        INF-137 (ESO/ASM infra half). Committed fallback keys (in git history since
        2025-01-29) are permanently burned — never reuse them.
      - First rotation MUST complete by 2026-08-15 (Rule4 POA&M committed date) and is
        sequenced with merging the VEP-1977 ve-app PR (chart requires the ESO secret
        when railsEnv=production; app fails closed without SECRET_KEY_BASE).
      - Rotation does NOT require any ve-app code/chart change once VEP-1977 is merged —
        it is purely ASM update + pod restart (that property is by design).
      - Subsequent cadence: annual (bump `expires` +12 months after each rotation).

  - name: CI_BOT_APP_PRIVATE_KEY
    description: Private key for the org-owned `valid-eval-ci-bot` GitHub App (contents:write, pull_requests:write, metadata:read), used to mint installation tokens so CI pushes retrigger workflows; installed on selected repos (currently ve-app)
    expires: "2027-09-16"
    remind_days_before: 15
    jira_priority: Highest
    rotation_steps: |-
      1. Go to https://github.com/organizations/Valid-Eval/settings/apps/valid-eval-ci-bot
         → Private keys → "Generate a private key" (downloads a .pem)
      2. Update at https://github.com/organizations/Valid-Eval/settings/secrets/actions
         - Find CI_BOT_APP_PRIVATE_KEY, click Update, paste the full .pem contents
         - Keep visibility "selected" and the existing repo list (currently ve-app)
      3. On the App's Private keys page, delete EVERY key except the one just generated —
         GitHub keeps every generated key valid until it is deleted, so do this BEFORE
         verifying, or step 4 could pass on an old key. The page must then list exactly
         one key, and its fingerprint (the part after "SHA256:" on GitHub) must equal the
         output of this command run on the downloaded .pem (ignore any trailing "="):
         `openssl rsa -in PATH_TO_PEM_FILE -pubout -outform DER | openssl sha256 -binary | openssl base64`
      4. Verify: in ve-app Actions, re-run the most recent "Renovate Shared Lockfile Sync"
         run whose conclusion is `success` (NOT a `skipped` one — it re-runs as skipped and
         proves nothing). Its "Generate CI bot installation token" step must show a green
         check, not a grey "skipped" icon. With only the new key left valid, a pass here
         can only come from the new key. If no such run is still re-runnable, the check is
         the next Renovate lockfile-sync run — watch that one
      5. Securely delete the downloaded .pem from local disk
    notes: |-
      - GitHub App private keys never expire on their own; `expires` here is a chosen
        annual rotation cadence, first key created 2026-09-16
      - The App's Client ID (org variable CI_BOT_APP_CLIENT_ID) and App ID are public
        identifiers and are not rotated
      - Compromise impact: code push + PR write on every repo the App is installed on —
        on suspected exposure, delete the key on the App page immediately, then rotate

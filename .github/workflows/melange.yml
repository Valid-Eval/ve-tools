name: melange

# Guards for the shared melange recipes (see melange/README.md). Nothing here publishes: the job
# builds and tests the packages the same way image-* CIs do, then discards them.
# pull_request only (never pull_request_target): build-test runs PR-supplied recipe code as root
# through the runner's docker socket, which is acceptable only with no secrets and a read-only token.
on:
  pull_request:
    paths:
      - "melange/**"
      - "renovate.json"
      - ".github/scripts/**"
      - ".github/workflows/melange.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melange-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate-regex:
    # Renovate's regex managers fail silently: if an edit breaks the match, Renovate just stops
    # proposing updates (for libpq-17.yaml, PostgreSQL security releases).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the checker
        run: node --test .github/scripts/check-renovate-regex.test.js

      - name: Check melange customManagers cover every recipe, once each
        run: node .github/scripts/check-renovate-regex.js melange/

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build.sh guards and the tests-ran check reject bad input (no docker needed)
        # Match the expected message, not just a non-zero exit: without the arch guard build.sh
        # still fails, later and for another reason.
        run: |
          expect_fail() {  # <expected message> <command...>
            local want="$1"; shift
            if out="$("$@" 2>&1)"; then echo "::error::accepted: $*"; exit 1; fi
            # Show the expected failure without turning it into a red annotation on a green run.
            sed 's/::error::/(expected) /' <<<"$out"
            grep -qF -- "$want" <<<"$out" || { echo "::error::failed without '$want': $*"; exit 1; }
          }
          expect_fail "unknown arch 'mips'" melange/build.sh melange/libpq-17.yaml mips "$RUNNER_TEMP/x"
          mkdir -p "$RUNNER_TEMP/stale/x86_64" && touch "$RUNNER_TEMP/stale/x86_64/old.apk"
          expect_fail "is not empty" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/stale"
          log="$RUNNER_TEMP/test.log"
          printf '%s\n' "INFO running the main test pipeline" \
            "INFO running test pipeline for subpackage ve-libpq-17-dev" \
            "INFO running test pipeline for subpackage ve-postgresql-17-client" > "$log"
          melange/check-tests-ran.sh melange/libpq-17.yaml "$log"
          grep -v 'subpackage ve-libpq-17-dev' "$log" > "$log.missing"
          expect_fail "ran 2 test blocks, recipe has 3" melange/check-tests-ran.sh melange/libpq-17.yaml "$log.missing"
          printf 'package:\n  name: x\n' > "$RUNNER_TEMP/notests.yaml"
          expect_fail "has no test blocks" melange/check-tests-ran.sh "$RUNNER_TEMP/notests.yaml" "$log"
          expect_fail "cannot read" melange/check-tests-ran.sh melange/libpq-17.yaml "$RUNNER_TEMP/absent.log"
          # A failure after the EXIT trap is set must exit exactly 1 and leave no workspace behind:
          # a stub docker that exits 7 stands in for any mid-run failure.
          # The stub records that it ran, so a build.sh that fails earlier (before the trap is set)
          # can't satisfy this check by also exiting 1.
          mkdir -p "$RUNNER_TEMP/stub" && printf '#!/bin/sh\ntouch "$0.called"\nexit 7\n' > "$RUNNER_TEMP/stub/docker"
          chmod +x "$RUNNER_TEMP/stub/docker"
          rc=0; PATH="$RUNNER_TEMP/stub:$PATH" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/trap-out" || rc=$?
          [ -e "$RUNNER_TEMP/stub/docker.called" ] || { echo "::error::build.sh failed before reaching docker"; exit 1; }
          [ "$rc" = 1 ] || { echo "::error::build.sh exited $rc after a mid-run failure, expected 1"; exit 1; }
          if ls -d "$RUNNER_TEMP"/melange-ws.* 2>/dev/null; then echo "::error::build.sh left its workspace behind"; exit 1; fi

      - name: Build and test libpq-17 (amd64)
        run: melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/melange-out"

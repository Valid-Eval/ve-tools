name: melange

# Guards for the shared melange recipes (see melange/README.md). Nothing here publishes: the job
# builds and tests the packages the same way image-* CIs do, then discards them.
# pull_request only (never pull_request_target): build-test runs PR-supplied recipe code as root
# through the runner's docker socket, which is acceptable only with no secrets and a read-only token.
on:
  pull_request:
    paths:
      - "melange/**"
      - "renovate.json"
      - ".github/scripts/**"
      - ".github/workflows/melange.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melange-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate-regex:
    # Renovate's regex managers fail silently: if an edit breaks the match, Renovate just stops
    # proposing updates (for libpq-17.yaml, PostgreSQL security releases).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the checker
        run: node --test .github/scripts/check-renovate-regex.test.js

      - name: Check melange customManagers cover every recipe, once each
        run: node .github/scripts/check-renovate-regex.js melange/

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build.sh guards and the tests-ran check reject bad input (no docker needed)
        # Match the expected message, not just a non-zero exit: without the arch guard build.sh
        # still fails, later and for another reason.
        run: |
          expect_fail() {  # <expected message> <command...>
            local want="$1"; shift
            if out="$("$@" 2>&1)"; then echo "::error::accepted: $*"; exit 1; fi
            # Show the expected failure without turning it into a red annotation on a green run.
            sed 's/::error::/(expected) /' <<<"$out"
            grep -qF -- "$want" <<<"$out" || { echo "::error::failed without '$want': $*"; exit 1; }
          }
          expect_fail "unknown arch 'mips'" melange/build.sh melange/libpq-17.yaml mips "$RUNNER_TEMP/x"
          mkdir -p "$RUNNER_TEMP/stale/x86_64" && touch "$RUNNER_TEMP/stale/x86_64/old.apk"
          expect_fail "is not empty" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/stale"
          log="$RUNNER_TEMP/test.log"
          printf '%s\n' "INFO running test pipeline for subpackage ve-libpq-17" \
            "INFO running test pipeline for subpackage ve-libpq-17-dev" \
            "INFO running test pipeline for subpackage ve-postgresql-17-client" > "$log"
          melange/check-tests-ran.sh melange/libpq-17.yaml "$log"
          grep -v 'subpackage ve-libpq-17-dev' "$log" > "$log.missing"
          expect_fail "ran 2 test blocks, recipe has 3" melange/check-tests-ran.sh melange/libpq-17.yaml "$log.missing"
          printf 'package:\n  name: x\n' > "$RUNNER_TEMP/notests.yaml"
          expect_fail "has no test blocks" melange/check-tests-ran.sh "$RUNNER_TEMP/notests.yaml" "$log"
          expect_fail "cannot read" melange/check-tests-ran.sh melange/libpq-17.yaml "$RUNNER_TEMP/absent.log"
          # A failure after the EXIT trap is set must exit exactly 1 and leave no workspace behind:
          # a stub docker that exits 7 stands in for any mid-run failure.
          # The stub records that it ran, so a build.sh that fails earlier (before the trap is set)
          # can't satisfy this check by also exiting 1.
          mkdir -p "$RUNNER_TEMP/stub" && printf '#!/bin/sh\ntouch "$0.called"\nexit 7\n' > "$RUNNER_TEMP/stub/docker"
          chmod +x "$RUNNER_TEMP/stub/docker"
          rc=0; PATH="$RUNNER_TEMP/stub:$PATH" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/trap-out" || rc=$?
          [ -e "$RUNNER_TEMP/stub/docker.called" ] || { echo "::error::build.sh failed before reaching docker"; exit 1; }
          [ "$rc" = 1 ] || { echo "::error::build.sh exited $rc after a mid-run failure, expected 1"; exit 1; }
          if ls -d "$RUNNER_TEMP"/melange-ws.* 2>/dev/null; then echo "::error::build.sh left its workspace behind"; exit 1; fi
          # OPENSSL_LINE must be <major>.<minor>, rejected before any docker call.
          OPENSSL_LINE= expect_fail "OPENSSL_LINE is set but empty" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/x"
          for bad in 4 4.0.3 .4 4. a.b 4..0 04.0 3.06 0.0 5.0 99999.0; do
            OPENSSL_LINE="$bad" expect_fail "OPENSSL_LINE must be <major>.<minor> with major 3 or 4" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/x"
          done
          # A recipe without a var line, or with one twice, cannot be rendered: build.sh must stop
          # rather than build the default (missing) or leave a second copy unrendered (duplicate).
          printf 'package:\n  name: x\nvars:\n  openssl-minor: "6"\n' > "$RUNNER_TEMP/novars.yaml"
          OPENSSL_LINE=4.0 expect_fail "must define '  openssl-major: \"N\"' exactly once (found 0)" melange/build.sh "$RUNNER_TEMP/novars.yaml" amd64 "$RUNNER_TEMP/nv"
          sed 's/^  openssl-major: "3"$/  openssl-major: "3"\n  openssl-major: "3"/' melange/libpq-17.yaml > "$RUNNER_TEMP/dupvars.yaml"
          [ "$(grep -c '^  openssl-major: ' "$RUNNER_TEMP/dupvars.yaml")" = 2 ] || { echo "::error::dupvars fixture not built"; exit 1; }
          OPENSSL_LINE=4.0 expect_fail "must define '  openssl-major: \"N\"' exactly once (found 2)" melange/build.sh "$RUNNER_TEMP/dupvars.yaml" amd64 "$RUNNER_TEMP/dv"
          # The rendered recipe must reach `melange build` AND `melange test`, and check-tests-ran.sh
          # must accept the run. A stub docker records the vars of the recipe each melange command
          # is handed, fakes a signed repo for `build` (so build.sh's output checks pass) and a test
          # log naming every test block for `test`; build.sh must then run to the end (exit 0).
          mkdir -p "$RUNNER_TEMP/stub2"
          cat > "$RUNNER_TEMP/stub2/docker" <<'STUB'
          #!/bin/sh
          prev=; cmd=; recipe=; out=; key=
          for a in "$@"; do
            [ "$prev" = keygen ] && key="$a"
            case "$a" in
              build|test|keygen) [ -z "$cmd" ] && [ "$prev" != "--arch" ] && cmd="$a" ;;
            esac
            case "$a" in *.yaml) [ -z "$recipe" ] && recipe="$a" ;; esac
            [ "$prev" = --out-dir ] && out="$a"
            prev="$a"
          done
          case "$cmd" in
            keygen) echo fake > "$key.pub"; exit 0 ;;
            build)
              grep -E '^  openssl-(major|minor):' "$recipe" | tr -d ' \n' > "$SEEN.build"
              mkdir -p "$out/x86_64" && echo fake > "$out/x86_64/fake.apk" && echo fake > "$out/x86_64/APKINDEX.tar.gz"
              exit 0 ;;
            test)
              grep -E '^  openssl-(major|minor):' "$recipe" | tr -d ' \n' > "$SEEN.test"
              for sp in $(sed -n 's/^  - name: \(ve-[a-z0-9-]*\)$/\1/p' "$recipe"); do echo "INFO running test pipeline for subpackage $sp"; done
              exit 0 ;;
          esac
          exit 7
          STUB
          chmod +x "$RUNNER_TEMP/stub2/docker"
          for line in default 4.0; do
            want='openssl-major:"3"openssl-minor:"6"'; set -- env -u OPENSSL_LINE
            [ "$line" = 4.0 ] && { want='openssl-major:"4"openssl-minor:"0"'; set -- env OPENSSL_LINE=4.0; }
            rm -f "$RUNNER_TEMP/seen.build" "$RUNNER_TEMP/seen.test"
            rc=0; SEEN="$RUNNER_TEMP/seen" PATH="$RUNNER_TEMP/stub2:$PATH" \
              "$@" melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/r-$line" > "$RUNNER_TEMP/r-$line.log" 2>&1 || rc=$?
            [ "$rc" = 0 ] || { cat "$RUNNER_TEMP/r-$line.log"; echo "::error::OPENSSL_LINE=$line: build.sh exited $rc with a stub docker (check-tests-ran.sh or an output check failed)"; exit 1; }
            for phase in build test; do
              got="$(cat "$RUNNER_TEMP/seen.$phase" 2>/dev/null || true)"
              [ "$got" = "$want" ] || { cat "$RUNNER_TEMP/r-$line.log"; echo "::error::OPENSSL_LINE=$line: melange $phase got [$got], expected [$want]"; exit 1; }
            done
            echo "OPENSSL_LINE=$line: melange build and melange test both got $want; build.sh completed"
          done

      - name: Build and test libpq-17 (amd64)
        run: melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/melange-out"

  # The same recipe at OpenSSL 4.0, as an image on an OpenSSL-4-only base builds it (OPENSSL_LINE).
  # A separate job so the two builds don't share a runner's disk.
  build-test-openssl-4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test libpq-17 at OpenSSL 4.0 (amd64)
        run: OPENSSL_LINE=4.0 melange/build.sh melange/libpq-17.yaml amd64 "$RUNNER_TEMP/melange-out"

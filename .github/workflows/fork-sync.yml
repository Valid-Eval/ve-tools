# Fork Upstream Sync
#
# Keeps Valid-Eval's public forks of upstream open-source projects identical to upstream
# on their default branch. Contribution work happens on topic branches in the forks, never
# on the synced branch, so the synced branch must only ever fast-forward.
#
# Per fork, each run:
#   1. checks the fork's parent and upstream's default branch still match the matrix entry
#      (an upstream default-branch rename, e.g. activegraph 12 -> 13, fails the run);
#   2. fails unless upstream's head is a fast-forward of the fork's (compare status
#      "ahead" with behind_by 0). Otherwise the fork branch has its own commits, or
#      upstream rewrote its history;
#   3. moves the fork's branch to exactly the upstream SHA checked in step 2 with
#      PATCH git/refs force=false, which GitHub only accepts as a fast-forward.
#      merge-upstream is not used: it re-reads upstream and can create a merge commit if
#      upstream force-pushes between steps 2 and 3;
#   4. re-reads the fork's head and fails unless it is the SHA from step 2. (Upstream may
#      have moved on since; the next run picks that up, so this is not a false red.)
# On pull_request it is a dry run with a read-only token: steps 1 and 2 only, plus step 4
# when the heads are already equal. Every API failure ends in an ::error annotation and a
# FAIL line in the step summary.
#
# Known limitation: the CI bot App has no `workflows` permission, so GitHub rejects a ref
# update whose upstream range touches .github/workflows/*. Upstream changes its workflows
# often (neo4j-ruby-driver: 2026-09-21, 10-26, 10-27), so expect this regularly. The run goes
# red; sync that fork by hand with the "Sync fork" button on its GitHub page, then re-run.
#
# Recovery if a fork's branch ever carries its own commit (step 2 fails every run): an org
# admin resets it to upstream, e.g. the fork's "Sync fork" > "Discard commits".
#
# Forks not listed in the matrix are never synced.
#
# A failed or cancelled scheduled or dispatched run opens (or comments on) one ve-tools issue titled
# "Fork upstream sync failing", so a red run does not depend on GitHub's notification to
# whoever last edited the cron line.
#
# Required org variable:  CI_BOT_APP_CLIENT_ID
# Required org secret:    CI_BOT_APP_PRIVATE_KEY
# The `valid-eval-ci-bot` App installation must include every fork in the matrix.

name: Fork Upstream Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fork-sync.yml

permissions: {}

concurrency:
  # One group for schedule and dispatch, so the alert job never runs twice at once.
  group: fork-sync-${{ github.event_name == 'pull_request' && 'pr' || 'sync' }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync ${{ matrix.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - fork: activegraph
            upstream: neo4jrb/activegraph
            branch: "12"
          - fork: neo4j-ruby-driver
            upstream: neo4jrb/neo4j-ruby-driver
            branch: main
    steps:
      - name: Generate CI bot installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: Valid-Eval
          repositories: ${{ matrix.fork }}
          # Read-only for the pull_request dry run; write only when the job will move the ref.
          permission-contents: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}

      - name: Sync ${{ matrix.fork }} from ${{ matrix.upstream }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FORK: Valid-Eval/${{ matrix.fork }}
          UPSTREAM: ${{ matrix.upstream }}
          BRANCH: ${{ matrix.branch }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          fail() { echo "::error title=${FORK}::$1"; echo "FAIL ${FORK}: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # Every read goes through api() and is followed by `|| fail`, so an API error is
          # reported with gh's own message (HTTP status included), never a bare set -e exit.
          # fail() runs in the main shell, not inside $(...), so its output reaches the log.
          api() { gh api "$@" 2>"$RUNNER_TEMP/api.err"; }
          api_err() { tr '\n' ' ' < "$RUNNER_TEMP/api.err"; }
          # Branch head by branch name (not commits/<ref>, which also matches tags and SHAs).
          head_of() { api "repos/$1/branches/${BRANCH}" --jq .commit.sha; }

          parent=$(api "repos/${FORK}" --jq '.parent.full_name // ""') \
            || fail "reading ${FORK} failed: $(api_err)"
          [ "$parent" = "$UPSTREAM" ] || fail "fork parent is '${parent}', expected ${UPSTREAM}"

          upstream_default=$(api "repos/${UPSTREAM}" --jq .default_branch) \
            || fail "reading ${UPSTREAM} failed: $(api_err)"
          [ "$upstream_default" = "$BRANCH" ] \
            || fail "upstream default branch is now '${upstream_default}', matrix says '${BRANCH}'; update this workflow"

          upstream_sha=$(head_of "$UPSTREAM") || fail "reading ${UPSTREAM} branch ${BRANCH} failed: $(api_err)"
          fork_sha=$(head_of "$FORK") || fail "reading ${FORK} branch ${BRANCH} failed: $(api_err)"
          echo "upstream ${UPSTREAM}@${BRANCH} = ${upstream_sha}"
          echo "fork     ${FORK}@${BRANCH} = ${fork_sha}"

          if [ "$fork_sha" != "$upstream_sha" ]; then
            # Compare in the upstream repo: base = fork head, head = upstream head.
            # Only "ahead" with behind_by == 0 is a fast-forward.
            if ! cmp=$(gh api "repos/${UPSTREAM}/compare/${fork_sha}...${upstream_sha}" \
                         --jq '"\(.status) \(.behind_by)"' 2>"$RUNNER_TEMP/cmp.err"); then
              err=$(tr '\n' ' ' < "$RUNNER_TEMP/cmp.err")
              case "$err" in
                *"(HTTP 404)"*) fail "upstream cannot relate fork head ${fork_sha} to its history (${err}): the fork branch has its own commits, or upstream rewrote history" ;;
                *) fail "compare API call failed: ${err}" ;;
              esac
            fi
            read -r status behind <<< "$cmp"
            [ "$status" = "ahead" ] && [ "$behind" = "0" ] \
              || fail "upstream ${BRANCH} is not a fast-forward of the fork's (status=${status}, behind_by=${behind}): the fork branch has its own commits, or upstream rewrote history"

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN ${FORK}: would fast-forward ${fork_sha} to ${upstream_sha}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # force=false: GitHub rejects anything that is not a fast-forward, and the
            # target is the exact SHA verified above, not whatever upstream holds now.
            if ! moved=$(gh api -X PATCH "repos/${FORK}/git/refs/heads/${BRANCH}" \
                           -f sha="$upstream_sha" -F force=false \
                           --jq .object.sha 2>"$RUNNER_TEMP/update.err"); then
              err=$(tr '\n' ' ' < "$RUNNER_TEMP/update.err")
              case "$err" in
                *[Ww]orkflow*) fail "ref update refused (${err}): the upstream range changes .github/workflows/* and the App lacks the workflows permission. Sync by hand with the fork's Sync fork button, then re-run" ;;
                *) fail "ref update failed: ${err}" ;;
              esac
            fi
            [ "$moved" = "$upstream_sha" ] || fail "ref update returned ${moved}, expected ${upstream_sha}"
          fi

          # Independent check: re-read the fork's head; it must be the verified upstream SHA.
          fork_after=$(head_of "$FORK") || fail "re-reading ${FORK} branch ${BRANCH} failed: $(api_err)"
          [ "$fork_after" = "$upstream_sha" ] \
            || fail "after sync, fork head ${fork_after} != verified upstream SHA ${upstream_sha}"
          echo "OK ${FORK}@${BRANCH} = ${fork_after}" >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: alert on failure
    needs: sync
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.sync.result == 'failure' || needs.sync.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Fork upstream sync failing"
          # List (not --search, whose index lags) and match the exact title.
          num=$(gh issue list -R "$REPO" --state open --limit 500 --json number,title \
                  --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          body="Fork upstream sync failed: ${RUN_URL}. See the run summary for which fork and why."
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body (INF-473). Close this once a run is green."
          fi

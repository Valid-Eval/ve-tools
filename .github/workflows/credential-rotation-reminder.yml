# Credential Rotation Reminders
#
# Checks .github/credential-rotations.yml (credentials approaching expiration) and
# .github/compliance-reviews.yml (scheduled compliance reviews approaching their due
# date) daily, and sends notifications via GitHub issue, Jira ticket, and email.
# Deduplicates by checking for an existing open issue with the exact title — each
# credential or review only triggers one round of notifications until the issue is
# closed, plus retries of any pending channel (see Retry state below). Each file carries its own email/Jira routing. The compliance file may be
# absent, empty, or have an empty reviews list without affecting credential reminders.
# A malformed compliance file fails validation (and so this run); the pull_request
# trigger catches that before merge when the change goes through a PR.
#
# Delivery failures are loud: if the GitHub issue, Jira ticket, or email fails for an
# in-window item, the run fails once, at the end, with a summary of item x channel x error.
# Items are isolated from each other, and an item's three channels from each other. If the
# dedup search itself fails, that item is skipped (to avoid duplicate tickets) and recorded.
# A channel that is not configured (no Jira credentials or SendGrid key) also fails the run,
# because nobody was told; set the optional repo or org variable ALLOW_UNCONFIGURED_CHANNELS
# to 'true' to turn that one check off (failed deliveries still fail the run).
# Retry state: a new GitHub issue is created already carrying pending:jira and pending:email,
# and each label is removed once its channel is delivered (or waived by the opt-out). A run
# that fails or is cancelled mid-way therefore leaves the issue pending, so the worst case is
# a repeat send, never a silent drop. Later runs retry only the pending channels, remove each
# label once delivered, and stay red until then. The opt-out never removes a pending label on a
# retry. An open issue with no pending label is treated as delivered and skipped (a failed label
# removal is itself recorded as a failure). If the issue itself failed to create, no state is
# recorded and the next run redoes every channel, which can repeat one that already succeeded.
# The offline harness
# (.github/tests/notify-outcomes.test.js) runs in the test-notify job on pull requests that
# touch the workflow, the harness, or the data files.
#
# Required org variable:
#   JIRA_USER_EMAIL  — Atlassian account email (for basic auth)
#
# Required org secrets:
#   JIRA_API_TOKEN   — https://id.atlassian.com/manage-profile/security/api-tokens
#   SG_API_KEY       — SendGrid API key

name: Credential Rotation Reminders

on:
  schedule:
    - cron: "0 9 * * *"   # Daily at 9 AM UTC
  pull_request:
    paths:
      - .github/credential-rotations.yml
      - .github/compliance-reviews.yml
      - .github/scripts/reminders_*.py
      - .github/scripts/test_reminders.py
      - .github/workflows/credential-rotation-reminder.yml
      - .github/tests/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log due credentials and compliance reviews without creating tickets or sending email"
        type: boolean
        default: false
      test_credential:
        description: "Send a real test notification for a synthetic credential (e.g. TEST_CREDENTIAL)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  test-reminders:
    # Fixture tests for the validate and check scripts; no secrets, no network beyond pip. Runs on pull_request only.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run reminder script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_reminders.py'

  test-notify:
    # Offline harness for the notify script below: the harness mocks GitHub/Jira/SendGrid
    # and uses dummy credentials; no secrets are passed. Kept out of the daily schedule.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run notify-outcomes harness
        run: node .github/tests/notify-outcomes.test.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate credential-rotations.yml and compliance-reviews.yml
        run: python3 .github/scripts/reminders_validate.py

  check-and-notify:
    needs: validate
    # Overlapping runs (schedule + dispatch / re-run) would both retry pending channels.
    # A newer pending run replaces an older pending one (e.g. a dry_run dispatch can replace
    # a queued scheduled run); the next daily run catches up, since retry labels persist.
    concurrency:
      group: credential-rotation-notify
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find credentials and compliance reviews due
        id: check
        env:
          TEST_CREDENTIAL: ${{ inputs.test_credential }}
        run: python3 .github/scripts/reminders_check.py

      - name: Create notifications for due credentials and compliance reviews
        if: steps.check.outputs.has_due == 'true' && (!inputs.dry_run || inputs.test_credential != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULT: ${{ steps.check.outputs.result }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SG_API_KEY: ${{ secrets.SG_API_KEY }}
          ALLOW_UNCONFIGURED_CHANNELS: ${{ vars.ALLOW_UNCONFIGURED_CHANNELS }}
        with:
          script: |
            const result = JSON.parse(process.env.CHECK_RESULT);
            const { due } = result;

            // Per-kind wording. Credential strings are the workflow's original wording, unchanged.
            const TEXT = {
              credential: {
                title: name => `Rotate credential: ${name}`,
                heading: name => `## Credential Rotation: \`${name}\``,
                dateWord: 'expires',
                jiraDateLabel: 'Expires',
                remaining: days => `${days} days until expiry`,
                remainingMd: days => `**${days} days** until expiry`,
                pastWord: 'EXPIRED',
                isPast: days => days <= 0,
                stepsHeading: 'Rotation Steps',
                jiraStepsLabel: '*Rotation steps:*',
                defaultPriority: 'Highest',
                issueFooter: '*After rotating, update the `expires` date in `.github/credential-rotations.yml`, commit, and close this issue.*',
                jiraFooter: 'After rotating, update the expires date in .github/credential-rotations.yml in the ve-tools repo and close this ticket.',
                emailFooter: 'After rotating, update the expires date in .github/credential-rotations.yml in the ve-tools repo.',
              },
              compliance_review: {
                title: name => `Compliance review due: ${name}`,
                heading: name => `## Compliance Review: \`${name}\``,
                dateWord: 'due',
                jiraDateLabel: 'Due',
                remaining: days => `${days} days until due`,
                remainingMd: days => `**${days} days** until due`,
                pastWord: 'OVERDUE',
                isPast: days => days < 0,  // due today is not overdue
                stepsHeading: 'Review Steps',
                jiraStepsLabel: '*Review steps:*',
                defaultPriority: 'High',
                issueFooter: '*After the review, record the outcome, set the next `due` date in `.github/compliance-reviews.yml` (or remove the entry), commit, and close this issue.*',
                jiraFooter: 'After the review, record the outcome, set the next due date in .github/compliance-reviews.yml in the ve-tools repo (or remove the entry), and close this ticket.',
                emailFooter: 'After the review, record the outcome and set the next due date in .github/compliance-reviews.yml in the ve-tools repo (or remove the entry).',
              },
            };

            // Ensure 'maintenance' label exists. Non-fatal: issues.create also creates a missing label,
            // and a GitHub hiccup here must not stop Jira and email for every item.
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'maintenance',
              });
            } catch (e) {
              if (e.status !== 404) console.error(`getLabel(maintenance) failed: ${e.message}`);
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'maintenance',
                  color: '0e8a16',
                  description: 'Maintenance and operational tasks',
                });
              } catch (e2) {
                if (e2.status !== 422) console.error(`createLabel(maintenance) failed: ${e2.message}`);
              }
            }

            // Delivery outcomes: every failure (and, unless ALLOW_UNCONFIGURED_CHANNELS is 'true', every
            // unconfigured channel) is collected here and fails the run once, at the end.
            const failures = [];
            const allowUnconfigured = (process.env.ALLOW_UNCONFIGURED_CHANNELS || '').toLowerCase() === 'true';
            const recordFailure = (cred, channel, error) => {
              failures.push(`${cred.kind} ${cred.name} x ${channel}: ${String(error).replace(/\s+/g, ' ').slice(0, 300)}`);
            };
            const recordUnconfigured = (cred, channel, reason) => {
              if (allowUnconfigured) return false;
              recordFailure(cred, channel, `not configured (${reason}); set ALLOW_UNCONFIGURED_CHANNELS=true to allow`);
              return true;
            };

            // Retry state: when the item's GitHub issue exists, a Jira/email channel that failed (or was
            // unconfigured without the opt-out) leaves a pending label on it. Later runs retry only those
            // channels and remove each label once delivered, so the run stays red until delivery happens.
            // The opt-out never removes a pending label.
            const PENDING = { jira: 'pending:jira', email: 'pending:email' };

            for (const cred of due) {
              // One item's failure must not drop the remaining reminders: record it, carry on.
              try {
                await notify(cred);
              } catch (e) {
                console.error(`Unexpected error for ${cred.name}: ${e.message}`);
                recordFailure(cred, 'item', e.message);
              }
            }

            if (failures.length) {
              core.setFailed(`${failures.length} notification delivery failure(s):\n${failures.map(f => `- ${f}`).join('\n')}`);
            }

            async function notify(cred) {
              const text = TEXT[cred.kind];
              if (!text) {
                recordFailure(cred, 'kind', `unknown reminder kind '${cred.kind}'`);
                return;
              }
              const { email_to, email_from, jira_project } = cred;
              const titlePrefix = cred.is_test ? '[TEST] ' : '';
              const title = text.title(cred.name);
              const issueTitle = `${titlePrefix}${title}`;
              const issueLabels = cred.is_test ? ['maintenance', 'test'] : ['maintenance'];

              // Entries with compliance_ref/jira_ref (compliance reviews) get a References section;
              // credential entries set neither, so their notifications are unchanged.
              const refs = [];
              if (cred.compliance_ref) refs.push(`Compliance record: ${cred.compliance_ref}`);
              if (cred.jira_ref) refs.push(`Jira: https://valideval.atlassian.net/browse/${cred.jira_ref}`);

              // --- Dedup: an open issue means this item was already raised (unless test credential).
              // If it still carries pending labels, retry only those channels.
              let issueNumber = null;
              let retryOnly = null;
              if (!cred.is_test) {
                let search;
                try {
                  search = await github.rest.search.issuesAndPullRequests({
                    q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}" label:maintenance`,
                  });
                } catch (e) {
                  // Without the dedup answer, sending could duplicate tickets: skip the item, fail the run.
                  recordFailure(cred, 'dedup-search', `${e.message} (item skipped)`);
                  return;
                }
                // Title search is a phrase match, so require an exact title before treating it as a duplicate.
                const existing = search.data.items.find(i => i.title === title);
                if (existing) {
                  const labels = (existing.labels || []).map(l => l.name);  // search API returns label objects
                  const pending = Object.keys(PENDING).filter(ch => labels.includes(PENDING[ch]));
                  if (!pending.length) {
                    console.log(`Skipping ${cred.name} — open issue #${existing.number} exists`);
                    return;
                  }
                  issueNumber = existing.number;
                  retryOnly = new Set(pending);
                  console.log(`Retrying ${pending.join(', ')} for ${cred.name} (open issue #${issueNumber})`);
                }
              }
              const wants = ch => !retryOnly || retryOnly.has(ch);
              const pendingAfter = {};  // attempted channel -> true (still owed) / false (delivered); unset = untouched

              const urgency = text.isPast(cred.days_left)
                ? `**${text.pastWord}** (${Math.abs(cred.days_left)} days ago)`
                : text.remainingMd(cred.days_left);

              const statusText = text.isPast(cred.days_left)
                ? `${text.pastWord} (${Math.abs(cred.days_left)} days ago)`
                : text.remaining(cred.days_left);

              // --- GitHub Issue ---
              const issueBody = [
                text.heading(cred.name),
                '',
                cred.description,
                '',
                `**Status:** ${urgency} (${text.dateWord} ${cred.date})`,
                '',
                `### ${text.stepsHeading}`,
                '',
                cred.steps,
                '',
                ...(refs.length ? ['### References', '', ...refs.map(r => `- ${r}`), ''] : []),
                '### Notes',
                '',
                cred.notes || 'None',
                '',
                '---',
                text.issueFooter,
              ].join('\n');

              if (!retryOnly) {
                try {
                  const issue = await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issueTitle,
                    // Born owing both channels: the state is on the issue from the moment it exists,
                    // so a failed or cancelled run cannot leave an open issue that reads as delivered.
                    labels: [...issueLabels, ...Object.values(PENDING)],
                    body: issueBody,
                  });
                  issueNumber = issue.data.number;
                  console.log(`Created GitHub issue #${issue.data.number} for ${cred.name}`);
                  // The retry design assumes the pending labels attached (the API drops labels silently
                  // when the caller may not apply them). Without them, a failed channel would read as
                  // delivered tomorrow, so say so now.
                  const got = (issue.data.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                  const missing = Object.values(PENDING).filter(l => !got.includes(l));
                  if (missing.length) recordFailure(cred, 'retry-state', `issue #${issueNumber} was created without ${missing.join(', ')}`);
                } catch (e) {
                  console.error(`GitHub issue error for ${cred.name}: ${e.message}`);
                  recordFailure(cred, 'github-issue', e.message);
                }
              }

              // --- Jira Ticket ---
              if (!wants('jira')) {
                // Already delivered for this open issue.
              } else if (process.env.JIRA_USER_EMAIL && process.env.JIRA_API_TOKEN) {
                pendingAfter.jira = true;
                try {
                  const jiraAuth = Buffer.from(
                    `${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`
                  ).toString('base64');

                  const jiraDesc = [
                    cred.description,
                    '',
                    `${text.jiraDateLabel}: ${cred.date} (${statusText})`,
                    '',
                    text.jiraStepsLabel,
                    cred.steps.split('\n').map(line => {
                      // Convert markdown numbered list to Jira wiki syntax
                      const m = line.match(/^(\d+)\.\s+(.*)/);
                      return m ? `# ${m[2]}` : line;
                    }).join('\n'),
                    '',
                    ...(refs.length ? [...refs, ''] : []),
                    text.jiraFooter,
                  ].join('\n');

                  const jiraRes = await fetch('https://valideval.atlassian.net/rest/api/2/issue', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Basic ${jiraAuth}`,
                    },
                    body: JSON.stringify({
                      fields: {
                        project: { key: jira_project },
                        issuetype: { name: 'Task' },
                        priority: { name: cred.jira_priority || text.defaultPriority },
                        summary: `${titlePrefix}${title}`,
                        description: jiraDesc,
                      },
                    }),
                  });

                  if (jiraRes.ok) {
                    pendingAfter.jira = false;
                    // The ticket exists once Jira answers 2xx; an unparseable body must not report it as failed.
                    const jiraData = await jiraRes.json().catch(() => ({}));
                    console.log(`Created Jira ticket ${jiraData.key ?? '(key not parsed)'} for ${cred.name}`);
                  } else {
                    const errText = await jiraRes.text();
                    console.error(`Jira API error for ${cred.name}: ${jiraRes.status} ${errText}`);
                    recordFailure(cred, 'jira', `HTTP ${jiraRes.status} ${errText}`);
                  }
                } catch (e) {
                  console.error(`Jira error for ${cred.name}: ${e.message}`);
                  recordFailure(cred, 'jira', e.message);
                }
              } else {
                console.log('Skipping Jira — JIRA_USER_EMAIL or JIRA_API_TOKEN not configured');
                // Owed and not waived: pending. Waived: leave retry state untouched (no add, no remove).
                if (recordUnconfigured(cred, 'jira', 'JIRA_USER_EMAIL or JIRA_API_TOKEN missing')) pendingAfter.jira = true;
              }

              // --- Email via SendGrid ---
              if (!wants('email')) {
                // Already delivered for this open issue.
              } else if (process.env.SG_API_KEY && email_to) {
                pendingAfter.email = true;
                try {
                  const emailBody = [
                    cred.description,
                    '',
                    `Status: ${statusText} (${text.dateWord} ${cred.date})`,
                    '',
                    `${text.stepsHeading}:`,
                    cred.steps,
                    '',
                    ...(refs.length ? ['References:', ...refs, ''] : []),
                    cred.notes ? `Notes:\n${cred.notes}` : '',
                    '',
                    text.emailFooter,
                  ].join('\n');

                  const sgRes = await fetch('https://api.sendgrid.com/v3/mail/send', {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${process.env.SG_API_KEY}`,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                      personalizations: [{ to: [{ email: email_to }] }],
                      from: { email: email_from || email_to, name: 'Valid Eval Maintenance' },
                      subject: `[Action Required] ${titlePrefix}${title}`,
                      content: [{ type: 'text/plain', value: emailBody }],
                    }),
                  });

                  if (sgRes.ok || sgRes.status === 202) {
                    pendingAfter.email = false;
                    console.log(`Sent email to ${email_to} for ${cred.name}`);
                  } else {
                    const errText = await sgRes.text();
                    console.error(`SendGrid error for ${cred.name}: ${sgRes.status} ${errText}`);
                    recordFailure(cred, 'email', `HTTP ${sgRes.status} ${errText}`);
                  }
                } catch (e) {
                  console.error(`SendGrid error for ${cred.name}: ${e.message}`);
                  recordFailure(cred, 'email', e.message);
                }
              } else {
                console.log('Skipping email — SG_API_KEY or email_to not configured');
                if (recordUnconfigured(cred, 'email', 'SG_API_KEY or email_to missing')) pendingAfter.email = true;
              }

              // --- Retry state on the GitHub issue (only when the issue exists; if it failed to
              // create, nothing is recorded and the next run redoes every channel) ---
              // A new issue is created owing both channels (see issues.create), so a run that dies
              // before this point leaves them pending, and the worst case is a repeat send.
              // First run: unlabel every channel that is not still owed (delivered, or waived by the
              // opt-out). Retry run: unlabel the channels it attempted and delivered; the opt-out
              // never removes a pending label. A failed removal is recorded: a stale label re-sends a
              // delivered channel tomorrow.
              if (issueNumber) {
                const remove = retryOnly
                  ? Object.keys(pendingAfter).filter(ch => !pendingAfter[ch])
                  : Object.keys(PENDING).filter(ch => pendingAfter[ch] !== true);
                for (const ch of remove) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name: PENDING[ch],
                    });
                  } catch (e) {
                    if (e.status === 404) continue;  // already removed (e.g. by an overlapping run)
                    recordFailure(cred, 'retry-state', `could not remove ${PENDING[ch]} from issue #${issueNumber}: ${e.message}`);
                  }
                }
              }
            }

# Credential Rotation Reminders
#
# Checks .github/credential-rotations.yml (credentials approaching expiration) and
# .github/compliance-reviews.yml (scheduled compliance reviews approaching their due
# date) daily, and sends notifications via GitHub issue, Jira ticket, and email.
# Deduplicates by checking for an existing open issue with the exact title — each
# credential or review only triggers one round of notifications until the issue is
# closed. Each file carries its own email/Jira routing. The compliance file may be
# absent, empty, or have an empty reviews list without affecting credential reminders.
# A malformed compliance file fails validation (and so this run); the pull_request
# trigger catches that before merge when the change goes through a PR.
#
# Required org variable:
#   JIRA_USER_EMAIL  — Atlassian account email (for basic auth)
#
# Required org secrets:
#   JIRA_API_TOKEN   — https://id.atlassian.com/manage-profile/security/api-tokens
#   SG_API_KEY       — SendGrid API key

name: Credential Rotation Reminders

on:
  schedule:
    - cron: "0 9 * * *"   # Daily at 9 AM UTC
  pull_request:
    paths:
      - .github/credential-rotations.yml
      - .github/compliance-reviews.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log due credentials and compliance reviews without creating tickets or sending email"
        type: boolean
        default: false
      test_credential:
        description: "Send a real test notification for a synthetic credential (e.g. TEST_CREDENTIAL)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate credential-rotations.yml and compliance-reviews.yml
        run: |
          python3 << 'PYEOF'
          import os, re, sys, datetime, yaml

          # Reminder sources: (path, list key, required per-entry fields, date field, may be empty).
          # credential-rotations.yml stays credential-only; compliance reviews live in their own file.
          # Keep in step with SOURCES in the check step below. Compliance reviews retire, so that file
          # may be absent, empty, or have an empty list; none of those may stop credential reminders.
          # (A malformed compliance file still fails validation.)
          SOURCES = [
              ('.github/credential-rotations.yml', 'credentials',
               ('name', 'description', 'expires', 'rotation_steps'), 'expires', False),
              ('.github/compliance-reviews.yml', 'reviews',
               ('name', 'description', 'due', 'steps', 'compliance_ref', 'jira_ref'), 'due', True),  # may be empty or absent
          ]
          # Shape checks for the compliance links rendered into notifications.
          FIELD_PATTERNS = {
              'jira_ref': (r'[A-Z][A-Z0-9]+-\d+', 'a Jira key like INF-382'),
              'compliance_ref': (r'https://\S+', 'an https:// URL'),
          }

          errors = []
          today = datetime.date.today()

          for config_path, list_key, required_fields, date_field, may_be_empty in SOURCES:
              if may_be_empty and not os.path.exists(config_path):
                  print(f"OK: {config_path} not present (no {list_key} scheduled; none will be sent)")
                  continue

              # --- Parse YAML ---
              try:
                  with open(config_path) as f:
                      config = yaml.safe_load(f)
              except (OSError, yaml.YAMLError) as e:
                  print(f"FATAL: cannot read {config_path} as YAML:\n{e}")
                  sys.exit(1)

              if config is None and may_be_empty:
                  # Zero-byte or comments-only file
                  print(f"OK: {config_path} is empty (no {list_key} scheduled; none will be sent)")
                  continue

              if not isinstance(config, dict):
                  print(f"FATAL: {config_path} must contain a YAML mapping, got {type(config).__name__}")
                  sys.exit(1)

              entries = config.get(list_key)
              if entries is None and may_be_empty:
                  entries = []
              if not isinstance(entries, list) or (len(entries) == 0 and not may_be_empty):
                  errors.append(f"{config_path}: '{list_key}' must be a {'list' if may_be_empty else 'non-empty list'}")
                  continue

              # --- Top-level routing fields (only needed when there is something to send) ---
              if entries or not may_be_empty:
                  for field in ('email_to', 'email_from', 'jira_project'):
                      if not config.get(field):
                          errors.append(f"{config_path}: missing top-level field: '{field}'")

              # --- Per-entry validation ---
              seen_names = set()
              for i, entry in enumerate(entries):
                  if not isinstance(entry, dict):
                      errors.append(f"{config_path}: {list_key}[{i}] must be a mapping")
                      continue
                  label = entry.get('name', f'{list_key}[{i}]')

                  for field in required_fields:
                      value = entry.get(field)
                      if not value:
                          errors.append(f"{label}: missing required field '{field}'")
                      elif not isinstance(value, str):
                          hint = ' (quote dates: "YYYY-MM-DD")' if field == date_field else ''
                          errors.append(f"{label}: '{field}' must be a string, got {type(value).__name__}{hint}")

                  for field, (pattern, what) in FIELD_PATTERNS.items():
                      value = entry.get(field)
                      if field in required_fields and isinstance(value, str) and not re.fullmatch(pattern, value):
                          errors.append(f"{label}: '{field}' must be {what} (got '{value}')")

                  # Validate name contains only safe characters, and is unique (it forms the dedup title)
                  name = entry.get('name', '')
                  if isinstance(name, str) and name:
                      if not re.fullmatch(r'[A-Za-z0-9_-]+', name):
                          errors.append(f"{list_key}[{i}]: 'name' must contain only alphanumeric characters, hyphens, and underscores (got {name!r})")
                      if name in seen_names:
                          errors.append(f"{label}: duplicate name in {config_path}")
                      seen_names.add(name)

                  # Validate the date field is a parseable ISO date
                  date_raw = entry.get(date_field, '')
                  if isinstance(date_raw, str) and date_raw:
                      try:
                          date = datetime.date.fromisoformat(date_raw)
                          days_left = (date - today).days
                          if days_left < 0:
                              print(f"WARNING: {label} {date_field} date passed {abs(days_left)} days ago ({date_raw})")
                          else:
                              print(f"OK: {label} — {date_field} {date_raw} ({days_left} days from now)")
                      except ValueError:
                          errors.append(f"{label}: '{date_field}' value '{date_raw}' is not a valid ISO date (expected YYYY-MM-DD)")

                  # Validate remind_days_before is a positive integer if present
                  if 'remind_days_before' in entry:
                      rdb = entry['remind_days_before']
                      if not isinstance(rdb, int) or isinstance(rdb, bool) or rdb <= 0:
                          errors.append(f"{label}: 'remind_days_before' must be a positive integer (got '{rdb}')")

              print(f"{config_path}: {len(entries)} entr{'y' if len(entries) == 1 else 'ies'} under '{list_key}' checked")

          if errors:
              print(f"\n{len(errors)} validation error(s):")
              for e in errors:
                  print(f"  ERROR: {e}")
              sys.exit(1)
          else:
              print("\nAll reminder entries validated successfully")
          PYEOF

  check-and-notify:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find credentials and compliance reviews due
        id: check
        env:
          TEST_CREDENTIAL: ${{ inputs.test_credential }}
        run: |
          python3 << 'PYEOF'
          import json, datetime, os, uuid, yaml

          # Reminder sources: (path, list key, kind, date field, steps field). Keep in step with
          # SOURCES in the validate step above. The notify step words each kind's notification
          # separately; credential notifications are unchanged.
          SOURCES = [
              ('.github/credential-rotations.yml', 'credentials', 'credential', 'expires', 'rotation_steps'),
              ('.github/compliance-reviews.yml', 'reviews', 'compliance_review', 'due', 'steps'),
          ]
          # Entry fields passed through to the notify step (anything else in the YAML is ignored).
          PASSTHROUGH = ('name', 'description', 'notes', 'jira_priority', 'remind_days_before',
                         'compliance_ref', 'jira_ref')

          today = datetime.date.today()
          due = []
          configs = {}
          for config_path, list_key, kind, date_field, steps_field in SOURCES:
              if kind == 'compliance_review' and not os.path.exists(config_path):
                  configs[kind] = {}  # validate allows an absent compliance file
                  continue
              with open(config_path) as f:
                  configs[kind] = yaml.safe_load(f) or {}


          def routing(kind):
              # Each source file carries its own notification routing.
              config = configs[kind]
              return {
                  'email_to': config.get('email_to', ''),
                  'email_from': config.get('email_from', ''),
                  'jira_project': config.get('jira_project', 'VEP'),
              }


          test_name = os.environ.get('TEST_CREDENTIAL', '').strip()
          if test_name:
              # Synthetic test credential — bypasses expiration check
              due.append({
                  'kind': 'credential',
                  'name': test_name,
                  'description': f'Integration test for credential rotation notifications',
                  'date': today.isoformat(),
                  'days_left': 0,
                  'remind_days_before': 15,
                  'jira_priority': 'Lowest',
                  'steps': '1. This is a test notification — no action required\n2. Close the GitHub issue and Jira ticket when done testing',
                  'notes': 'Generated by workflow_dispatch with test_credential input',
                  'is_test': True,
                  **routing('credential'),
              })
              print(f"Test mode: sending notifications for synthetic credential '{test_name}'")
          else:
              for config_path, list_key, kind, date_field, steps_field in SOURCES:
                  for entry in configs[kind].get(list_key) or []:
                      date = datetime.date.fromisoformat(str(entry[date_field]))
                      days_left = (date - today).days
                      if days_left <= entry.get('remind_days_before', 15):
                          item = {k: entry[k] for k in PASSTHROUGH if k in entry}
                          item.update(kind=kind, date=str(entry[date_field]), steps=str(entry[steps_field]),
                                      days_left=days_left, **routing(kind))
                          due.append(item)

          delimiter = f"ghadelimiter_{uuid.uuid4()}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"result<<{delimiter}\n")
              f.write(json.dumps({'due': due}))
              f.write(f"\n{delimiter}\n")
              f.write(f"has_due={'true' if due else 'false'}\n")

          if due and not test_name:
              print(f"{len(due)} reminder(s) due:")
              for c in due:
                  past = 'EXPIRED' if c['kind'] == 'credential' else 'OVERDUE'
                  status = f"{past} ({abs(c['days_left'])} days ago)" if c['days_left'] < 0 else f"{c['days_left']} days left"
                  print(f"  - [{c['kind']}] {c['name']}: {status}")
          elif not due:
              print("No credentials or compliance reviews due")
          PYEOF

      - name: Create notifications for due credentials
        if: steps.check.outputs.has_due == 'true' && (!inputs.dry_run || inputs.test_credential != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULT: ${{ steps.check.outputs.result }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SG_API_KEY: ${{ secrets.SG_API_KEY }}
        with:
          script: |
            const result = JSON.parse(process.env.CHECK_RESULT);
            const { due } = result;

            // Per-kind wording. Credential strings are the workflow's original wording, unchanged.
            const TEXT = {
              credential: {
                title: name => `Rotate credential: ${name}`,
                heading: name => `## Credential Rotation: \`${name}\``,
                dateWord: 'expires',
                jiraDateLabel: 'Expires',
                remaining: days => `${days} days until expiry`,
                remainingMd: days => `**${days} days** until expiry`,
                pastWord: 'EXPIRED',
                isPast: days => days <= 0,
                stepsHeading: 'Rotation Steps',
                jiraStepsLabel: '*Rotation steps:*',
                defaultPriority: 'Highest',
                issueFooter: '*After rotating, update the `expires` date in `.github/credential-rotations.yml`, commit, and close this issue.*',
                jiraFooter: 'After rotating, update the expires date in .github/credential-rotations.yml in the ve-tools repo and close this ticket.',
                emailFooter: 'After rotating, update the expires date in .github/credential-rotations.yml in the ve-tools repo.',
              },
              compliance_review: {
                title: name => `Compliance review due: ${name}`,
                heading: name => `## Compliance Review: \`${name}\``,
                dateWord: 'due',
                jiraDateLabel: 'Due',
                remaining: days => `${days} days until due`,
                remainingMd: days => `**${days} days** until due`,
                pastWord: 'OVERDUE',
                isPast: days => days < 0,  // due today is not overdue
                stepsHeading: 'Review Steps',
                jiraStepsLabel: '*Review steps:*',
                defaultPriority: 'High',
                issueFooter: '*After the review, record the outcome, set the next `due` date in `.github/compliance-reviews.yml` (or remove the entry), commit, and close this issue.*',
                jiraFooter: 'After the review, record the outcome, set the next due date in .github/compliance-reviews.yml in the ve-tools repo (or remove the entry), and close this ticket.',
                emailFooter: 'After the review, record the outcome and set the next due date in .github/compliance-reviews.yml in the ve-tools repo (or remove the entry).',
              },
            };

            // Ensure 'maintenance' label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'maintenance',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'maintenance',
                color: '0e8a16',
                description: 'Maintenance and operational tasks',
              });
            }

            for (const cred of due) {
              // One item's failure must not drop the remaining reminders: report it, fail the run, carry on.
              try {
                await notify(cred);
              } catch (e) {
                core.setFailed(`${cred.kind} ${cred.name}: ${e.message}`);
              }
            }

            async function notify(cred) {
              const text = TEXT[cred.kind];
              if (!text) {
                core.setFailed(`Unknown reminder kind '${cred.kind}' for ${cred.name}`);
                return;
              }
              const { email_to, email_from, jira_project } = cred;
              const titlePrefix = cred.is_test ? '[TEST] ' : '';
              const title = text.title(cred.name);
              const issueTitle = `${titlePrefix}${title}`;
              const issueLabels = cred.is_test ? ['maintenance', 'test'] : ['maintenance'];

              // Entries with compliance_ref/jira_ref (compliance reviews) get a References section;
              // credential entries set neither, so their notifications are unchanged.
              const refs = [];
              if (cred.compliance_ref) refs.push(`Compliance record: ${cred.compliance_ref}`);
              if (cred.jira_ref) refs.push(`Jira: https://valideval.atlassian.net/browse/${cred.jira_ref}`);

              // --- Dedup: skip if open issue already exists (unless test credential) ---
              if (!cred.is_test) {
                const search = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}" label:maintenance`,
                });
                // Title search is a phrase match, so require an exact title before treating it as a duplicate.
                const existing = search.data.items.find(i => i.title === title);
                if (existing) {
                  console.log(`Skipping ${cred.name} — open issue #${existing.number} exists`);
                  return;
                }
              }

              const urgency = text.isPast(cred.days_left)
                ? `**${text.pastWord}** (${Math.abs(cred.days_left)} days ago)`
                : text.remainingMd(cred.days_left);

              const statusText = text.isPast(cred.days_left)
                ? `${text.pastWord} (${Math.abs(cred.days_left)} days ago)`
                : text.remaining(cred.days_left);

              // --- GitHub Issue ---
              const issueBody = [
                text.heading(cred.name),
                '',
                cred.description,
                '',
                `**Status:** ${urgency} (${text.dateWord} ${cred.date})`,
                '',
                `### ${text.stepsHeading}`,
                '',
                cred.steps,
                '',
                ...(refs.length ? ['### References', '', ...refs.map(r => `- ${r}`), ''] : []),
                '### Notes',
                '',
                cred.notes || 'None',
                '',
                '---',
                text.issueFooter,
              ].join('\n');

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                labels: issueLabels,
                body: issueBody,
              });
              console.log(`Created GitHub issue #${issue.data.number} for ${cred.name}`);

              // --- Jira Ticket ---
              if (process.env.JIRA_USER_EMAIL && process.env.JIRA_API_TOKEN) {
                try {
                  const jiraAuth = Buffer.from(
                    `${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`
                  ).toString('base64');

                  const jiraDesc = [
                    cred.description,
                    '',
                    `${text.jiraDateLabel}: ${cred.date} (${statusText})`,
                    '',
                    text.jiraStepsLabel,
                    cred.steps.split('\n').map(line => {
                      // Convert markdown numbered list to Jira wiki syntax
                      const m = line.match(/^(\d+)\.\s+(.*)/);
                      return m ? `# ${m[2]}` : line;
                    }).join('\n'),
                    '',
                    ...(refs.length ? [...refs, ''] : []),
                    text.jiraFooter,
                  ].join('\n');

                  const jiraRes = await fetch('https://valideval.atlassian.net/rest/api/2/issue', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Basic ${jiraAuth}`,
                    },
                    body: JSON.stringify({
                      fields: {
                        project: { key: jira_project },
                        issuetype: { name: 'Task' },
                        priority: { name: cred.jira_priority || text.defaultPriority },
                        summary: `${titlePrefix}${title}`,
                        description: jiraDesc,
                      },
                    }),
                  });

                  if (jiraRes.ok) {
                    const jiraData = await jiraRes.json();
                    console.log(`Created Jira ticket ${jiraData.key} for ${cred.name}`);
                  } else {
                    const errText = await jiraRes.text();
                    console.error(`Jira API error for ${cred.name}: ${jiraRes.status} ${errText}`);
                  }
                } catch (e) {
                  console.error(`Jira error for ${cred.name}: ${e.message}`);
                }
              } else {
                console.log('Skipping Jira — JIRA_USER_EMAIL or JIRA_API_TOKEN not configured');
              }

              // --- Email via SendGrid ---
              if (process.env.SG_API_KEY && email_to) {
                try {
                  const emailBody = [
                    cred.description,
                    '',
                    `Status: ${statusText} (${text.dateWord} ${cred.date})`,
                    '',
                    `${text.stepsHeading}:`,
                    cred.steps,
                    '',
                    ...(refs.length ? ['References:', ...refs, ''] : []),
                    cred.notes ? `Notes:\n${cred.notes}` : '',
                    '',
                    text.emailFooter,
                  ].join('\n');

                  const sgRes = await fetch('https://api.sendgrid.com/v3/mail/send', {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${process.env.SG_API_KEY}`,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                      personalizations: [{ to: [{ email: email_to }] }],
                      from: { email: email_from || email_to, name: 'Valid Eval Maintenance' },
                      subject: `[Action Required] ${titlePrefix}${title}`,
                      content: [{ type: 'text/plain', value: emailBody }],
                    }),
                  });

                  if (sgRes.ok || sgRes.status === 202) {
                    console.log(`Sent email to ${email_to} for ${cred.name}`);
                  } else {
                    const errText = await sgRes.text();
                    console.error(`SendGrid error for ${cred.name}: ${sgRes.status} ${errText}`);
                  }
                } catch (e) {
                  console.error(`SendGrid error for ${cred.name}: ${e.message}`);
                }
              } else {
                console.log('Skipping email — SG_API_KEY or email_to not configured');
              }
            }
